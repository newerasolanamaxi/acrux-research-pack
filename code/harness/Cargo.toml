[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
solana-sdk = "=2.2.1"
acrux-crypto = { path = "../../../acrux/node/crates/acrux-crypto" }
acrux-consensus = { path = "../../../acrux/node/crates/acrux-consensus" }
acrux-execution = { path = "../../../acrux/node/crates/acrux-execution" }

[profile.dev]
opt-level = 1
debug = 0
[profile.dev.package."*"]
opt-level = 2
